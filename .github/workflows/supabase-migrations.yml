name: Supabase Migrations

on:
  push:
    branches:
      - main
      - develop

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      statuses: write

    environment: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Check for supabase changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            supabase:
              - 'supabase/**'

      - uses: supabase/setup-cli@v1
        if: steps.changes.outputs.supabase == 'true'
        with:
          version: latest

      - run: supabase link --project-ref $SUPABASE_PROJECT_ID --password $SUPABASE_DB_PASSWORD
        if: steps.changes.outputs.supabase == 'true'

      - run: supabase db push --password $SUPABASE_DB_PASSWORD
        if: steps.changes.outputs.supabase == 'true'

      - name: 'notify vercel'
        uses: 'vercel/repository-dispatch/actions/status@v1'
        with:
          name: 'Vercel - dinio: Github Actions'
